<!DOCTYPE html>
<html>
<head>
    <title>Alvlinibliti Scanner</title>

    <style>
        body{
            background:black;
            color:#00ff00;
            font-family:monospace;
            padding:20px;
        }

        input{
            width:300px;
            padding:10px;
            background:#111;
            color:#00ff00;
            border:1px solid #00ff00;
        }

        button{
            padding:10px;
            background:#00ff00;
            border:none;
            color:black;
            font-weight:bold;
        }

        pre{
            background:#111;
            padding:15px;
            border:1px solid #00ff00;
            overflow:auto;
        }
    </style>
</head>

<body>

    <h1>ALVLINIBLITI SCANNER</h1>

    <input type="text" id="domain" placeholder="google.com">

    <button onclick="scan()">
        SCAN
    </button>

    <pre id="result"></pre>

<script>

async function scan(){

    let domain =
        document.getElementById("domain").value;

    let res =
        await fetch("/scan/" + domain);

    let data =
        await res.json();

    document.getElementById("result")
        .innerText =
        JSON.stringify(data, null, 4);
}

</script>

</body>
</html>
